<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لا يوجد اتصال بالإنترنت</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
    body { background: #0b1120; color: #f8fafc; font-family: 'Cairo', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; padding: 20px; }
    .box { background: #1e293b; padding: 40px 30px; border-radius: 24px; border: 2px solid #4f46e5; max-width: 400px; width: 100%; }
    .icon { font-size: 70px; margin-bottom: 20px; }
    h1 { color: #4f46e5; font-size: 24px; margin-bottom: 15px; }
    p { color: #94a3b8; line-height: 1.8; font-size: 16px; margin-bottom: 25px; }
    button { background: #4f46e5; color: #fff; border: none; padding: 15px 30px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
</style>
</head>
<body>
    <div class="box">
        <div class="icon">📡</div>
        <h1>لا يوجد اتصال بالإنترنت</h1>
        <p>يبدو أنك غير متصل بالإنترنت حالياً. يرجى التحقق من اتصالك بالشبكة (Wi-Fi أو بيانات الهاتف) والمحاولة مرة أخرى.</p>
        <button onclick="window.location.reload()">🔄 حاول مرة أخرى</button>
    </div>
</body>
</html>
